services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/gk_academy
      JWT_SECRET: ${JWT_SECRET:-change_this_super_secret}
      FRONTEND_URL: http://localhost:3000
      PAYMENTS_MODE: ${PAYMENTS_MODE:-mock}
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY:-}
      WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY:-}
      WOMPI_INTEGRITY_SECRET: ${WOMPI_INTEGRITY_SECRET:-}
      WOMPI_REDIRECT_URL: http://localhost:3000/dashboard
    depends_on: [mongo]
    ports: ["4000:4000"]
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    restart: unless-stopped
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  mongo_data:
